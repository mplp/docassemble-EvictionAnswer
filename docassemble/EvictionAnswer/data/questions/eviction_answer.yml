code: |
  repair_issues[i].problem
  if repair_issues[i].caused_by_tenant:
    repair_issues[i].eligible = False
    repair_ineligible_caused_by_tenant
  else:
    if repair_issues[i].notified:
      repair_issues[i].notified_by_phone # will also ask about personal and letter/mail
    elif repair_issues[i].obvious:
      repair_issues[i].reason_LL_knew
    elif repair_issues[i].other_reason_LL_knew:
      repair_issues[i].knew_LL_knew
    else:
      repair_issues[i].eligible = False
      repair_ineligible_no_knowledge

  if not defined("repair_issues[i].eligible"):
    repair_issues[i].eligible = True

  repair_issues[i].complete = True
