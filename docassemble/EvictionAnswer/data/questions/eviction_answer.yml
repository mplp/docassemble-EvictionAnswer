#################### Interview order #####################
#################### Interview order #####################
#################### Interview order #####################
id: interview_order_answer_complaint_eviction
mandatory: True
code: |
  snapshot_start
  nav.set_section("review_full")
  nav.set_section("signpost_intro")

  testing = True
  if testing:
    users[0].name.first = "Brett"
    users[0].name.last = "Harrison"
    grounds = "Rent"
  else:
    MLH_intro_landing
    MLH_agree_terms
    MLH_intro_navigate_save
    MLH_intro_time
    if not verify_residential:
      kickout_not_residential
    eviction_intro_papers
    eviction_intro_serious
    eviction_intro_complaint_types

  
  if testing:
    grounds = "Rent"
  else:
    grounds
    if grounds == "Rent":
      grounds_reason
      rental_assistance
      if rental_assistance:
        rental_assistance_yes
      else:
        rental_assistance_no1
    elif grounds == "Land":
      kickout_land_contract
    elif grounds == "Mobile":
      own_mobile
      if own_mobile:
        kickout_own_mobile
    else:
      grounds_reason

    if not grounds == "Mobile":
      if subsidized in "Y|IDK":
        kickout_subsidized
  
    nav.set_section("review_basic_info")
    users.gather()
    county_choice
    if court_count > 1:
      specific_court_location
    docket_number
    intro_written_answer

  nav.set_section("review_complaint_issues")
  if grounds == "Rent":
    if demand_received:
      demand_received_date
    users[0].address.address
    if rental_address_same:
      still_live_at_rental = True
    else:
      if still_live_at_rental:
        rental_address[0].address
      else:
        move_date
    complaint_filing_date
    complaint_service_date
    if not jury_trial_landlord == "Y":
      jury_trial_user
  # todo - damage, poss, MH
  
  nav.set_section("review_other_parties")
  # TODO - figure out if gather can start on the second iteration since we already got the user
  if users.there_is_another:
    users.gather()
  set_parts(subtitle=str(users))

  if plaintiff_is_ll:
    plaintiff_name_only
  else:
    plaintiff_and_landlord
  plaintiff[0].address.address
  if plaintiff[0].has_attorney:
    plaintiff_attorneys[0].bar_number # will also get name
    plaintiff_attorneys[0].address.address
    plaintiff_attorneys[0].no_phone_number

  nav.set_section("review_admissions")
  service_intro1
  service_intro2
  service_by_mail
  if personal_service:
    service_by_who
  elif service_by_other:
    service_by_who

  answer_instructions1
  answer_instructions2

  if grounds == "Rent":
    owner_admission
    if still_live_at_rental:
      possession_admissison
    if owe_money_admission == "Admit":
      owe_money_admission_sanity
    if owe_money_admission == "Disagree" or owe_money_admission_sanity == "Disagree":
      owe_money_disagree_rate
      if owe_money_disagree_other:
        if late_fees_listed:
          late_fees_over_30
      owe_money_disagree_summary
    complaint_claims_subsidized
  # todo - damage, poss, MH

  nav.set_section("review_repair_issues")
  if grounds == "Rent":
    complaint_claims_fit
    if proper_health_admission == "Disagree":
      health_safety_issues
      health_safety_proof
    if proper_health_admission == "Disagree" or proper_repair_admission == "Disagree":
      repair_issues_intro
      repair_issues.gather()
    ask_fit_for_use = False
    if lease_year_or_more:
      if modify_duty_repair:
        ask_fit_for_use = True
      else:
        if fit_for_use_exception:
          ask_fit_for_use = True
    elif fit_for_use_exception:
      ask_fit_for_use = True
    if ask_fit_for_use:
      fit_for_use_boxes
      if fit_for_use_tenant_damage:
        fit_for_use_tenant_damage_admission
      if fit_for_use_no_obligation:
        fit_for_use_no_obligation_admission
      if fit_for_use_other:
        fit_for_use_other_admission
  # todo - damage, poss, MH

  
  MLH_outro_saving_answers
  MLH_patience_assembling
  nav.set_section("review_get_forms_info")
  snapshot_download
  MLH_download

  interview_order_answer_complaint_eviction = True
#################### Interview order END #####################
#################### Interview order END #####################
#################### Interview order END #####################


