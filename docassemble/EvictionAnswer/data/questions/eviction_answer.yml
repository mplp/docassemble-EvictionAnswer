---
id: MLH intro landing FirstScreen
question: |
  ${ MLH_interview_short_title }
subquestion: |
  Welcome to Michigan Legal Help's Do-It-Yourself Answer to Eviction Complaint tool.
  
  This tool will help you complete the forms you will need to file an Answer to an Eviction Complaint. It applies if you got a COMPLAINT that says Landlord-Tenant in the top section.

  ${ collapse_template(landing_template) }

continue button field: MLH_intro_landing
---
template: landing_template
subject: |
  How do I know if I got a Complaint?
content: |
  It will say 'Complaint' and 'Landlord-Tenant' in the heading. 

  ${ image_complaint_header.show(width="150%") }
---
id: 2-Intro
question: |
  This tool is for eviction from residential rental properties
subquestion: |
  It does not apply if you're being evicted from a commercial property, such as an office, warehouse, or store.
fields:
  - Is your a lease for a residence?: verify_residential
    datatype: yesnoradio
---
id: 2.x-Intro EXIT
question: |
  This tool can only used for evictions involving a residential lease.
subquestion: |
  Eviction is a serious matter. You may want to talk to a lawyer. If you can't afford a lawyer, you may qualify for free legal assistance from your local legal services office. ${ MLH_GUIDE_FULL }
event: kickout_not_residential
---
id: 6-Intro
question: |
  Collect your papers and documentation
subquestion: |
  Make sure you have any papers you got in the case because you'll need information from them to answer the questions.
  
  This includes:
  
  * The Summons and Complaint (court papers) you got telling you the case was filed
  * A copy of your lease, if you have one
  * The Notice to Quit or Demand for Possession, if you got one from your landlord
  * Proof of your payments, if any
  * Any evidence you have showing you tried to fix problems with your landlord
  * Copies of any notices or requests for repairs you've sent or given your landlord
  * Proof that you paid for repairs to your home that you want your landlord to pay for (receipts, cancelled checks, and invoices)

  ${ collapse_template(notice_demand_template) }
continue button field: eviction_intro_papers
---
template: notice_demand_template
subject: |
  What is a Notice to Quit or Demand for Possession?
content: |
  You may be entitled to notice before your landlord can evict you. There are two kinds of notice. Both kinds tell you why your landlord wants you to leave and how much time you have to act to avoid eviction.

  ${ image_quit_or_demand.show(width="150%") }
---
id: 7-Careful
question: |
  Eviction is a serious matter.
subquestion: |
  You may want to talk to a lawyer. If you can't afford a lawyer, you may qualify for free legal assistance from your local legal services office. ${ MLH_GUIDE_FULL }
  
  Double-check your answers. They will appear in the forms exactly how you enter them.
continue button field: eviction_intro_serious
---
id: 1-Intro 2
question: |
  Types of complaints
subquestion: |
  This tool is for answering an eviction complaint that is on one of the following forms:
  
  * COMPLAINT, NONPAYMENT OF RENT
  * COMPLAINT TO RECOVER POSSESSION
  * COMPLAINT DAMAGE/HEALTH HAZARD TO PROPERTY
  * COMPLAINT, TERMINATION OF TENANCY, Mobile Home Park-Mobile Home Owner (Just Cause Termination)

  ${ collapse_template(complaint_types_template) }
continue button field: eviction_intro_complaint_types
---
template: complaint_types_template
subject: |
  What do you mean?
content: |
  There are forms the courts are required to accept. This tool assumes the eviction complaint you got used one of those forms.
  
  ${ image_complaint_nonpayment.show(width="150%") }
---
id: 2 Grounds
question: |
  Why are you being evicted?
subquestion: |
  Select one.
fields:
  - no label: grounds
    input type: radio
    choices:
      - NONPAYMENT OF RENT: Rent
      - TO RECOVER POSSESSION OF PROPERTY: Possession
      - DAMAGE/HEALTH HAZARD TO THE PROPERTY: Damage
      - FOR POSSESSION AFTER LAND CONTRACT FORFEITURE: Land
      - TERMINATION OF TENANCY, MOBILE HOME PARK-MOBILE HOME OWNER (JUST-CAUSE TERMINATION): Mobile
---
id: reason for complaint
question: |
  Reason for the complaint
subquestion: |
  % if grounds == "Rent":
  Your landlord is saying you should have to pay your rent or move out because you have not paid your rent.
  % elif grounds == "Possession":
  This means your landlord wants to evict you because:
  
  * your lease has expired,
  * your landlord believes you violated the lease,
  * your landlord wants to end a month-to-month lease, or
  * your landlord believes you are trespassing or keeping the property by force.
  % elif grounds == "Damage":
  Your landlord is saying you caused a health hazard or extensive and continuing damage to property you're renting.
  % endif
continue button field: grounds_reason
---
id: 3.1 Rent Assistance
question: |
  Rental Assistance
fields:
  - Have you applied for Rental Assistance?: rental_assistance
    datatype: yesnoradio
---
id: 3.2a Rent Assistance Yes
question: |
  Rental Assistance
subquestion: |
  Be sure to tell the judge at your first hearing that you applied for rental assistance. You also need to fill out the [Rental Assistance Form](https://www.courts.michigan.gov/4ab584/siteassets/forms/scao-approved/dc539.pdf) (check "Proof of Application) and attach proof that you submitted an application. The Rental Assistance Form and attached proof needs to be filed with the court and served on your landlord or their lawyer, if they have one. You can do that when you are at court. The eviction case should be stayed, or paused, for at least 14 days to allow that application to be processed.
  
  Your eviction case will continue after those 14 days unless you file and serve the [Rental Assistance Form](https://www.courts.michigan.gov/4ab584/siteassets/forms/scao-approved/dc539.pdf) again (this time, check "Status Update), and attach proof that your application is still being processed or has been approved. You need to file and serve this second Rental Assistance Form and your proof within 14 days of when the judge first paused your case. In that case, the stay should be extended for 14 more days, for a total of 28 days.
  
  After those 28 days, your case will continue. Your next hearing after that stay could be your trial.
continue button field: rental_assistance_yes
---
id: 3.3a Rent Assistance No
question: |
  Rental Assistance
subquestion: |
  If you would like to see if there is rental assistance that you qualify for, please contact your local [Housing Assessment and Resource Agency (HARA)](https://www.michigan.gov/mcteh/governance/housing-assessment-and-resource-agency-hara).

  To get your case paused, you need to fill out the [Rental Assistance Form](https://www.courts.michigan.gov/4ab584/siteassets/forms/scao-approved/dc539.pdf) (check 'Proof of Application') and attach proof that you submitted an application. Within 5 days of your first hearing, you need to file the Rental Assistance Form and the attached proof with the court and serve (send) it to your landlord or their lawyer, if they have one.

  The eviction case should be stayed, or paused, for at least 14 days to allow that application to be processed. Your eviction case will continue after those 14 days unless you file and serve the [Rental Assistance Form](https://www.courts.michigan.gov/4ab584/siteassets/forms/scao-approved/dc539.pdf) again (this time, check 'Status Update') and attach proof that your application is still being processed or has been approved. You need to file and serve this second Rental Assistance Form and your proof within 14 days of when the judge first paused your case. In that case, the stay should be extended for 14 more days, for a total of 28 days.

  After those 28 days, your case will continue. Your next hearing after that stay could be your trial.
continue button field: rental_assistance_no1
---
id: 3.3b Rent Assistance No - unused to delete
question: |
  Rental Assistance
subquestion: |
  If you do not apply for rental assistance before your first hearing, you can still apply within 5 days after your first hearing. To get your case paused, you need to fill out the Rental Assistance Form (check 'Proof of Application') and attach proof that you submitted an application. Within 5 days of your first hearing, you need to file the Rental Assistance Form and the attached proof with the court and serve (send) it to your landlord or their lawyer, if they have one.

  The eviction case should be stayed, or paused, for at least 14 days to allow that application to be processed. Your eviction case will continue after those 14 days unless you file and serve the Rental Assistance Form again (this time, check 'Status Update') and attach proof that your application is still being processed or has been approved. You need to file and serve this second Rental Assistance Form and your proof within 14 days of when the judge first paused your case. In that case, the stay should be extended for 14 more days, for a total of 28 days.

  After those 28 days, your case will continue. Your next hearing after that stay could be your trial.
continue button field: rental_assistance_no2
---
id: 6x Land Contract Kickout
question: |
  We're sorry.
subquestion: |
  This tool is not yet set up for this type of eviction. Please see the eviction Resource pages at [michiganlegalhelp.org](https://michiganlegalhelp.org/) for information on this type of eviction.
event: kickout_land_contract
---
id: 7 Mobile
question: |
  Do you own your home?
fields:
  - Do you own your mobile home and rent the lot it is on?: own_mobile
    datatype: yesnoradio
---
id: 7.x Mobile home kickout if own home
question: |
  TODO
subquestion: |
  You may want to contact your local legal services office to see if they can represent you. ${ MLH_GUIDE_FULL }

  There are special protections for tenants of mobile home parks who own their mobile homes. It is unclear whether these protections apply to tenants who do not own their mobile homes.
event: kickout_own_mobile
---
id: 1 Subsidized
question: |
  Subsidized housing
subquestion: |
  Subsidized housing is housing the government helps pay for to make it affordable. It can include Section 8 housing vouchers, or a home in a complex that is subsidized.
fields:
  - Is your rental home subsidized?: subsidized
    datatype: radio
    choices:
      - Yes: Y
      - No: N
      - I don't know: IDK
---
id: 2 Subsidized
question: |
  Subsidized housing
subquestion: |
  %if subsidized == "Y":
  We're sorry, but this tool cannot help you. You probably qualify for help from legalsServices. ${ MLH_GUIDE_FULL }

  If you are evicted from subsidized housing, you will probably lose your subsidy (the help you get for paying your rent), and it may be hard to get subsidized housing again.
  % else:
  We're sorry, but you cannot use this tool if you do not know whether your rental home is subsidized. Evictions from subsidized housing can be more complicated than other evictions. These evictions can also have consequences besides just having to move out of your home. Losing your housing subsidy can make it harder for you to find affordable housing in the future.
  
  If you have a housing subsidy and are facing eviction or termination of your voucher, you may want to call your local legal services office to see if you can get help. ${ MLH_GUIDE_FULL }

  % endif
event: kickout_subsidized
---
id: Choose a court
question: |
  % if grounds == "Mobile":
  In what county is the mobile home lot that you rented?
  % else:
  In what county is your rented home?
  % endif
subquestion: |
  This should also be the county where the case was filed.
  
  % if al_form_type != 'starts_case':
  ${ collapse_template(help_user_choose_court_template) }
  % endif
fields:
