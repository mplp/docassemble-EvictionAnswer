template: naming_different_agents
subject: |
  What if I want to name different agents for different children?
content: |
  If you have children that will stay with different caregivers, you will need a separate form for each caregiver. 
  
  For example, if one child will stay with your mother and one child will stay with your friend, you will need two forms.

  Please use this tool one time for **each caregiver**.
