id: 8 Rent Reason disagree 5
question: |
  Answering the Complaint
subquestion: |
  You said that you disagree with paragraph 5. Look at parts a through e of paragraph 5 very carefully.

  Which parts do you disagree with? _Check all that apply._ 
fields: 
  - Part a - Rental rate: owe_money_disagree_rate
    datatype: yesno
    help: This is the amount of rent you're supposed to pay according to your lease.
  - Part b - Payable on: owe_money_disagree_payable
    datatype: yesno
    help: This is the day of the month you're supposed to pay your rent according to your lease. For example, rent is often payable on the first of the month.
  - Part c - Rent is paid through: owe_money_disagree_paid_through
    datatype: yesno
    help: This is the last date your rent covered. For example, if you paid your monthly rent on June 1, rent is paid through June 30.
  - Part d - Total rent due: owe_money_disagree_rent_due
    datatype: yesno
    help: This is how much rent you owe. It should be your rental rate multiplied by how far behind you are in your rent. So if you're paying monthly, it's the rent times how many months behind you are. If you owe for part of a month, your landlord may have calculated what you owe for that part of the month.
  - Part e - Other money due: owe_money_disagree_other
    datatype: yesno
    help: This is late fees and other money your landlord thinks you owe under your lease.
  - Why do you disagree with the rental rate (part a)?: owe_money_disagree_rate_reason
    show if:
      variable: owe_money_disagree_rate
      is: True
  - Why do you disagree with the payable on date (part b)?: owe_money_disagree_payable_reason
    show if:
      variable: owe_money_disagree_payable
      is: True
  - Why do you disagree with the date rent is paid through (part c)?: owe_money_disagree_paid_through_reason
    show if:
      variable: owe_money_disagree_paid_through
      is: True
  - Why do you disagree with the total rent now due (part d)?: owe_money_disagree_rent_due_reason
    show if:
      variable: owe_money_disagree_rent_due
      is: True
  - Why do you disagree with the other money due (part e)?: owe_money_disagree_other_reason
    show if:
      variable: owe_money_disagree_other
      is: True
