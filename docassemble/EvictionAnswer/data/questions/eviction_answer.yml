---
template: template_health_safety
subject: |
  How do I know?
content: |
  This includes having the home registered with the city, if your city requires that. It also means that the home is up to code.

  If you live in Detroit, this includes having a Certificate of Compliance with the local lead laws.

  You can do research to see if your city requires that rental properties be registered with the city. Most places that require registration have a way for you to check to see if your home has been registered by your landlord.

  For example:

  * If you live in Detroit, you can go to the [City of Detroit Rental Compliance Map](https://detroitmi.gov/departments/buildings-safety-engineering-and-environmental-department/bseed-divisions/property-maintenance/rental-property/rental-compliance-map). Type in your address to check if your home is registered and if your home has a certificate of compliance for lead.
  * If you live in Lansing, you can use the [City of Lansing Rental Registrations page](https://www.lansingmi.gov/293/Rental-Registrations)) to search if your home is registered and if your home has any code violations.
  * If you live in Grand Rapids, you can use the [City of Grand Rapids Rental Certification Program site](https://www.grandrapidsmi.gov/Government/Programs-and-Initiatives/Rental-Certification-Program) to check if your home has a certificate of compliance.
