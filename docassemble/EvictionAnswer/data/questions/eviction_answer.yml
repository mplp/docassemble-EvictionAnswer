id: 20a Jury
question: |
  Jury trial
subquestion: |
  If you want a jury trial, you must pay a $50 fee when you file your answer. If you can't afford to pay but still want a jury trial, you may be able to have this fee waived. More information on how to get fees waived will be included in the instructions that you get with your forms.
