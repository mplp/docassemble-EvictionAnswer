---
id: DPA intro landing FirstScreen
question: |
  Delegation of Parental Authority
subquestion: |
  Welcome to the ${ MLH_interview_short_title } tool. 
  
  This tool will help you prepare a form to give someone besides you (or your children's other parent) temporary legal power to make decisions for your children. 
  
  ${ collapse_template(process_info) }
  
  It usually takes about **15-30 minutes** to answer all the questions and get your form.
  
  When you are finished, you will need need to **print and sign** this form to make it effective.

continue button field: DPA_intro_landing
---
template: process_info
subject: |
  What information will I need to use this tool?
content: |
  Before you get started, please gather:
  
  1. Contact information for the person you want to give parental authority to.
  2. (Optional) Your children's health care information, including:
      * allergies
      * medications
      * insurance
      * providers
      * preferred hospital

  To learn more about getting a Delegation of Parental Authority, read [Giving Someone Temporary Legal Power to Make Decisions for Your Child](https://michiganlegalhelp.org/resources/family/giving-someone-temporary-legal-power-make-decisions-your-child).
---
id: Do Not Use Warnings
continue button field: do_not_use_for
question: |
  This tool is **not** for custody issues with your child's other parent.
subquestion: |
  This tool is not right for you if you want to change custody or parenting time between you and your child’s other parent.

  * If you **need a custody order** and you are **not married** to your child’s other parent, visit [Filing a Custody Case (Unmarried Parents)](https://michiganlegalhelp.org/resources/family/filing-custody-case-unmarried-parents).
  * If you **need a custody order** and you **are married** to your child’s other parent, visit [Filing for Divorce with Children](https://michiganlegalhelp.org/resources/family/filing-divorce-children).
  * If you need to **change** parenting time in a custody case, visit [Filing to Change Parenting Time](https://michiganlegalhelp.org/resources/family/filing-change-parenting-time).
---
id: user information
sets:
  - users[i].name.first
  - users[i].name.last
  - users[i].name.middle
  - users[i].name.suffix    
question: |
