id: 1 Info
question: |
  Answering the Complaint
subquestion: |
  A complaint has a number of "paragraphs." Each paragraph should be numbered. Respond to each paragraph one at a time. 
  
  For each paragraph, you must say that you:
  
  * **Agree** with the statements in the paragraph
  * **Disagree** with the statements in the paragraph OR
  * **Don't know** whether the statements in the paragraph are true
continue button field: answer_instructions1
---
id: 1 Info
question: |
  Answering the Complaint
subquestion: |
  Follow these rules:
  
  * Do not agree with anything unless you **know** it is true;
  * Do not disagree with anything unless you **know** it is not true;
  * If you don't know, choose "I Don't Know."
  
  If a paragraph makes more than one claim, do not agree with it unless you agree with the **entire** paragraph.

  If you disagree with a paragraph, you will be asked to explain why you disagree with it. Briefly say what is wrong with the statement.
continue button field: answer_instructions2
